<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보이드 화면보호기</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
"use strict";
/*
  보이드(Boids) 화면보호기 — 속도에 따라 색이 바뀌는 버전 (느림 = 파랑 → 빠름 = 빨강)
  파일 하나, 외부 라이브러리 없음. 브라우저로 열고 더블클릭하면 전체 화면.

  아래 CONFIG만 고치면 됩니다. 주소 뒤에 ?n=800&trail=0 처럼 붙여도 같은 값이 바뀝니다.
*/
const CONFIG = {
  n: 0,              // 보이드 수. 0이면 화면 크기에 맞춰 자동(약 300~1200)
  trail: 0.7,        // 잔상 길이 0~1. 0이면 잔상 없음, 1이면 가장 김
  cycle: 40,         // 몇 초마다 다음 무리 모양으로 천천히 바뀔지. 0이면 안 바뀜
  predator: 1,       // 1이면 보이지 않는 포식자가 가끔 지나가서 떼가 갈라지고 색이 붉게 번짐
  fps: 60,           // 최대 프레임. 30으로 낮추면 전기를 덜 씀
  bg: "#000000",     // 배경색
};
for (const [k, v] of new URLSearchParams(location.search)) if (k in CONFIG) CONFIG[k] = k === "bg" ? v : +v;

// 무리 모양 (조절 패널 버전의 프리셋과 같은 값. 거리·속도는 800px 화면 기준이고 화면 크기에 맞춰 늘어남)
const PRESETS = [
  { sep: 1.5, ali: 1.0, coh: 1.0, view: 60,  sepDist: 22, maxSpeed: 3.5, maxForce: 0.06 }, // 새 떼
  { sep: 1.3, ali: 2.5, coh: 0.8, view: 45,  sepDist: 14, maxSpeed: 2.6, maxForce: 0.10 }, // 물고기 떼
  { sep: 0.8, ali: 0.3, coh: 3.0, view: 140, sepDist: 9,  maxSpeed: 2.5, maxForce: 0.12 }, // 뭉친 공
];
const P = Object.assign({}, PRESETS[0]);   // 지금 쓰는 값 (프리셋 사이를 천천히 보간)
let from = 0, to = 0, blend = 1;

const MAX_N = 1500;
const px = new Float32Array(MAX_N), py = new Float32Array(MAX_N);
const vx = new Float32Array(MAX_N), vy = new Float32Array(MAX_N);
const fx = new Float32Array(MAX_N), fy = new Float32Array(MAX_N);
const scared = new Uint8Array(MAX_N);
let N = 500, W = 800, H = 600, S = 1;    // S = 화면 크기 배율

const cv = document.getElementById("cv"), ctx = cv.getContext("2d", { alpha: false });
function resize() {
  const oldW = W, oldH = H, dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; S = Math.max(0.6, Math.min(W, H) / 800);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (let i = 0; i < MAX_N; i++) { px[i] = px[i] / oldW * W; py[i] = py[i] / oldH * H; }
  N = CONFIG.n > 0 ? Math.min(MAX_N, CONFIG.n) : Math.max(300, Math.min(1200, Math.round(W * H / 1700)));
  ctx.fillStyle = CONFIG.bg; ctx.fillRect(0, 0, W, H);
}
function spawnAll() {
  for (let i = 0; i < MAX_N; i++) {
    px[i] = Math.random() * W; py[i] = Math.random() * H;
    const a = Math.random() * Math.PI * 2; vx[i] = Math.cos(a) * 2; vy[i] = Math.sin(a) * 2;
  }
}

// 공간 격자: 칸 크기 ≥ 시야 반경이라 이웃은 둘레 9칸 안에만 있음
let cols = 1, rows = 1, cellW = 1, cellH = 1;
let cellStart = new Int32Array(2), cellCount = new Int32Array(1);
const sorted = new Int32Array(MAX_N), cellOf = new Int32Array(MAX_N);
function buildGrid(view) {
  cols = Math.max(1, Math.floor(W / view)); rows = Math.max(1, Math.floor(H / view));
  cellW = W / cols; cellH = H / rows;
  const nc = cols * rows;
  if (cellStart.length < nc + 1) { cellStart = new Int32Array(nc + 1); cellCount = new Int32Array(nc); }
  cellCount.fill(0, 0, nc);
  for (let i = 0; i < N; i++) {
    const cx = Math.min(cols - 1, (px[i] / cellW) | 0), cy = Math.min(rows - 1, (py[i] / cellH) | 0);
    const c = cy * cols + cx; cellOf[i] = c; cellCount[c]++;
  }
  cellStart[0] = 0;
  for (let c = 0; c < nc; c++) cellStart[c + 1] = cellStart[c] + cellCount[c];
  cellCount.fill(0, 0, nc);
  for (let i = 0; i < N; i++) { const c = cellOf[i]; sorted[cellStart[c] + cellCount[c]++] = i; }
}

// 보이지 않는 포식자: 화면을 천천히 가로지르며 가끔만 나타남
const pred = { x: -1e9, y: -1e9, active: false, t: 0, next: 12 };

let _sx = 0, _sy = 0, MS = 1, MF = 1;
function steer(dx, dy, i) {   // 원하는 방향 × 최대 속도 − 지금 속도, 최대 힘으로 자름
  const len = Math.hypot(dx, dy);
  if (len < 1e-9) { _sx = _sy = 0; return; }
  let sx = dx / len * MS - vx[i], sy = dy / len * MS - vy[i];
  const m = Math.hypot(sx, sy);
  if (m > MF) { sx *= MF / m; sy *= MF / m; }
  _sx = sx; _sy = sy;
}

function step(k) {
  const view = P.view * S, sepD = P.sepDist * S, view2 = view * view, sep2 = sepD * sepD;
  const fear = 130 * S, hw = W / 2, hh = H / 2;
  MS = P.maxSpeed * S; MF = P.maxForce * S;
  buildGrid(view);
  const cxR = cols < 3 ? [0, cols - 1] : [-1, 1], cyR = rows < 3 ? [0, rows - 1] : [-1, 1];
  for (let i = 0; i < N; i++) {
    const xi = px[i], yi = py[i];
    let sX = 0, sY = 0, sN = 0, aX = 0, aY = 0, cX = 0, cY = 0, nb = 0;
    const ci = cellOf[i], gx = ci % cols, gy = (ci / cols) | 0;
    for (let oy = cyR[0]; oy <= cyR[1]; oy++) {
      const yy = rows < 3 ? oy : (gy + oy + rows) % rows;
      for (let ox = cxR[0]; ox <= cxR[1]; ox++) {
        const c = yy * cols + (cols < 3 ? ox : (gx + ox + cols) % cols);
        for (let s = cellStart[c], e = cellStart[c + 1]; s < e; s++) {
          const j = sorted[s]; if (j === i) continue;
          let dx = px[j] - xi, dy = py[j] - yi;
          if (dx > hw) dx -= W; else if (dx < -hw) dx += W;
          if (dy > hh) dy -= H; else if (dy < -hh) dy += H;
          const d2 = dx * dx + dy * dy; if (d2 >= view2) continue;
          nb++; aX += vx[j]; aY += vy[j]; cX += dx; cY += dy;           // 정렬·응집
          if (d2 < sep2 && d2 > 1e-6) { sX -= dx / d2; sY -= dy / d2; sN++; } // 분리
        }
      }
    }
    let FX = 0, FY = 0;
    if (sN) { steer(sX, sY, i); FX += _sx * P.sep; FY += _sy * P.sep; }
    if (nb) { steer(aX, aY, i); FX += _sx * P.ali; FY += _sy * P.ali;
              steer(cX, cY, i); FX += _sx * P.coh; FY += _sy * P.coh; }
    scared[i] = 0;
    if (pred.active) {
      let dx = xi - pred.x, dy = yi - pred.y;
      if (dx > hw) dx -= W; else if (dx < -hw) dx += W;
      if (dy > hh) dy -= H; else if (dy < -hh) dy += H;
      const d = Math.hypot(dx, dy);
      if (d < fear) { steer(dx, dy, i); const w = 5 * (1 - d / fear) + 1; FX += _sx * w; FY += _sy * w; scared[i] = 1; }
    }
    fx[i] = FX; fy[i] = FY;
  }
  const vmin = MS * 0.3;
  for (let i = 0; i < N; i++) {
    let ux = vx[i] + fx[i] * k, uy = vy[i] + fy[i] * k;
    const s = Math.hypot(ux, uy), vmax = scared[i] ? MS * 1.7 : MS;
    if (s > vmax) { ux *= vmax / s; uy *= vmax / s; } else if (s < vmin && s > 1e-9) { ux *= vmin / s; uy *= vmin / s; }
    let x = px[i] + ux * k, y = py[i] + uy * k;
    if (x < 0) x += W; else if (x >= W) x -= W;      // 가장자리는 반대편으로 이어짐
    if (y < 0) y += H; else if (y >= H) y -= H;
    px[i] = x; py[i] = y; vx[i] = ux; vy[i] = uy;
  }
}

// 속도 색: 조절 패널 버전과 같은 공식 (느림 = 파랑 → 빠름 = 빨강). 색을 36단계로 묶어 한 번에 칠함
const HUES = 36, buckets = Array.from({ length: HUES }, () => []);
const fills = Array.from({ length: HUES }, (_, b) => `hsl(${((b + 0.5) / HUES) * 0.62 * 360},85%,62%)`);
function draw() {
  if (CONFIG.trail > 0) {
    ctx.globalAlpha = 0.5 - 0.38 * Math.min(1, CONFIG.trail)  /* 0.12 아래로 내리면 화면에 희미한 얼룩이 남음 */;
    ctx.fillStyle = CONFIG.bg; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  } else { ctx.fillStyle = CONFIG.bg; ctx.fillRect(0, 0, W, H); }
  for (const b of buckets) b.length = 0;
  for (let i = 0; i < N; i++) {
    const t = Math.min(1, Math.hypot(vx[i], vy[i]) / MS);
    buckets[Math.min(HUES - 1, ((1 - t) * HUES) | 0)].push(i);
  }
  const size = 4.2 * S;
  for (let b = 0; b < HUES; b++) {
    const list = buckets[b]; if (!list.length) continue;
    ctx.fillStyle = fills[b]; ctx.beginPath();
    for (const i of list) {
      const s = Math.hypot(vx[i], vy[i]) || 1, ux = vx[i] / s, uy = vy[i] / s, x = px[i], y = py[i];
      ctx.moveTo(x + ux * size * 1.6, y + uy * size * 1.6);
      ctx.lineTo(x - ux * size + uy * size * 0.75, y - uy * size - ux * size * 0.75);
      ctx.lineTo(x - ux * size - uy * size * 0.75, y - uy * size + ux * size * 0.75);
      ctx.closePath();
    }
    ctx.fill();
  }
}

function update(sec) {
  // 무리 모양 천천히 바꾸기 (8초 동안 보간)
  if (CONFIG.cycle > 0) {
    if (blend >= 1 && (update.t = (update.t || 0) + sec) > CONFIG.cycle) { update.t = 0; from = to; to = (to + 1) % PRESETS.length; blend = 0; }
    if (blend < 1) {
      blend = Math.min(1, blend + sec / 8);
      const e = blend * blend * (3 - 2 * blend), A = PRESETS[from], B = PRESETS[to];
      for (const key in A) P[key] = A[key] + (B[key] - A[key]) * e;
    }
  }
  // 포식자: 가끔 나타나 직선으로 화면을 가로지름
  if (CONFIG.predator) {
    pred.t += sec;
    if (!pred.active && pred.t > pred.next) {
      const a = Math.random() * Math.PI * 2, r = Math.hypot(W, H) / 2;
      pred.sx = W / 2 - Math.cos(a) * r; pred.sy = H / 2 - Math.sin(a) * r;
      pred.ex = W / 2 + Math.cos(a) * r; pred.ey = H / 2 + Math.sin(a) * r;
      pred.active = true; pred.t = 0; pred.dur = 7;
    }
    if (pred.active) {
      const u = pred.t / pred.dur;
      pred.x = pred.sx + (pred.ex - pred.sx) * u + Math.sin(u * 9) * 60 * S;
      pred.y = pred.sy + (pred.ey - pred.sy) * u + Math.cos(u * 7) * 60 * S;
      if (u >= 1) { pred.active = false; pred.t = 0; pred.next = 18 + Math.random() * 20; }
    }
  }
}

let last = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = now - last;
  if (dt < 1000 / CONFIG.fps - 2) return;     // 프레임 상한
  last = now;
  const ms = Math.min(dt, 50);
  update(ms / 1000);
  step(ms / 16.667);
  draw();
}

addEventListener("resize", resize);
addEventListener("dblclick", () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
resize(); spawnAll();
window.saver = { CONFIG, P, step, draw, update, get N() { return N; }, vx, vy };
requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
</html>
